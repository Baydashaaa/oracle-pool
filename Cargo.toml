[package]
name = "oracle-pool"
version = "0.1.0"
edition = "2021"
description = "Prize pool and draw settlement for Oracle Draw on Terra Classic"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
library = []

[dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.0", features = ["iterator"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
